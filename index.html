<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#0a0a0f; color:#e8e8f0; height:100vh; display:flex; flex-direction:column; }
        .header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#0f0f18; border-bottom:1px solid rgba(255,255,255,0.05); }
        .logo { display:flex; align-items:center; gap:8px; font-weight:800; }
        .logo-icon { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#a29bfe,#6c5ce7); display:flex; align-items:center; justify-content:center; }
        .chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
        .msg { max-width:88%; padding:12px 16px; border-radius:18px; font-size:0.92rem; line-height:1.5; white-space:pre-wrap; }
        .msg.user { align-self:flex-end; background:linear-gradient(135deg,#6c5ce7,#4834d4); color:white; }
        .msg.ai { align-self:flex-start; background:#1a1a26; border:1px solid rgba(255,255,255,0.05); }
        .welcome { text-align:center; margin:auto; padding:20px; }
        .welcome-icon { font-size:3.5rem; margin-bottom:12px; }
        .welcome h2 { font-size:1.4rem; color:#a29bfe; margin-bottom:8px; }
        .welcome p { color:#888; font-size:0.85rem; }
        .input-area { padding:12px 16px; background:#0f0f18; border-top:1px solid rgba(255,255,255,0.05); }
        .input-wrap { display:flex; gap:8px; align-items:flex-end; background:#0a0a12; border-radius:24px; padding:6px 6px 6px 18px; border:1px solid rgba(255,255,255,0.08); }
        .input-wrap textarea { flex:1; background:transparent; border:none; color:#e8e8f0; font-size:0.92rem; padding:10px 0; outline:none; resize:none; max-height:120px; }
        .send-btn { width:40px; height:40px; border-radius:50%; border:none; background:linear-gradient(135deg,#6c5ce7,#4834d4); color:white; cursor:pointer; }
        .send-btn:disabled { opacity:0.4; }
        .typing span { display:inline-block; width:6px; height:6px; margin:0 2px; border-radius:50%; background:#6c5ce7; animation:bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay:0.2s; }
        .typing span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-6px); opacity:1; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><div class="logo-icon">✨</div> AI Chat</div>
        <button onclick="clearChat()" style="background:rgba(255,255,255,0.05);border:none;color:#aaa;padding:8px 14px;border-radius:10px;cursor:pointer;">🗑️ Hapus</button>
    </div>
    <div class="chat" id="chat">
        <div class="welcome">
            <div class="welcome-icon">🤖</div>
            <h2>Halo! Saya AI Chat</h2>
            <p>Tanyakan apa saja — coding, ide, atau pelajaran.</p>
        </div>
    </div>
    <div class="input-area">
        <div class="input-wrap">
            <textarea id="input" placeholder="Ketik pesan..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>
<script>
    const API_URL = '/api/chat';
    let messages = [];
    let isLoading = false;
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');

    function clearChat() {
        if (!confirm('Hapus percakapan?')) return;
        messages = [];
        chatEl.innerHTML = '<div class="welcome"><div class="welcome-icon">🤖</div><h2>Halo! Saya AI Chat</h2><p>Tanyakan apa saja.</p></div>';
    }

    function addMessage(role, content) {
        const welcome = chatEl.querySelector('.welcome');
        if (welcome) welcome.remove();
        const div = document.createElement('div');
        div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
        div.textContent = content;
        chatEl.appendChild(div);
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || isLoading) return;
        isLoading = true;
        sendBtn.disabled = true;
        addMessage('user', text);
        messages.push({ role: 'user', content: text });
        inputEl.value = '';

        const typingDiv = document.createElement('div');
        typingDiv.className = 'msg ai typing';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        chatEl.appendChild(typingDiv);
        chatEl.scrollTop = chatEl.scrollHeight;

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: messages, systemPrompt: 'Kamu adalah asisten AI yang cerdas dan ramah.' })
            });
            const data = await res.json();
            typingDiv.remove();
            if (data.error) { addMessage('ai', '❌ Error: ' + data.error); }
            else { addMessage('ai', data.reply); messages.push({ role: 'assistant', content: data.reply }); }
        } catch (err) {
            typingDiv.remove();
            addMessage('ai', '❌ Koneksi gagal: ' + err.message);
        }
        isLoading = false;
        sendBtn.disabled = false;
        inputEl.focus();
    }
</script>
</body>
</html>
